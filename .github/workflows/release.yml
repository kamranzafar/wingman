# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted publishing (OIDC):
# no API token is stored; PyPI trusts this workflow in this repo, in the "pypi" environment.
name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('src/wingman/__init__.py').read_text())[1])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }
      - run: uv sync && uv run ruff check src tests && uv run pytest -q
        env:
          WINGMAN_LINE_INPUT: "1"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
