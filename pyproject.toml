[project]
name = "community-wingman"
dynamic = ["version"]
description = "A human-in-the-loop copilot for online communities: finds conversations you can add to and drafts replies in your voice. You approve every post."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kamran Zafar" }]
keywords = ["cli", "reddit", "bluesky", "mastodon", "github-discussions", "claude", "llm", "community"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Internet",
]
dependencies = [
    "anthropic>=2.10",
    "praw>=7.8",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "certifi>=2024.2",
    "pypdf>=4.0",
]

[project.urls]
Homepage = "https://github.com/kamranzafar/wingman"
Issues = "https://github.com/kamranzafar/wingman/issues"
Changelog = "https://github.com/kamranzafar/wingman/releases"

[tool.hatch.version]
path = "src/wingman/__init__.py"

[project.scripts]
wingman = "wingman.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF"]
ignore = [
    "B008",    # typer.Option(...) in argument defaults is the typer idiom
    "SIM905",  # a block of words + .split() reads better than a long list of quoted strings
    "RUF001",  # deliberate typographic characters in user-facing strings
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wingman"]

# `wingman init` copies these; they live at the repo root so they're easy to find on GitHub.
[tool.hatch.build.targets.wheel.force-include]
"wingman.example.toml" = "wingman/templates/wingman.example.toml"
".env.example" = "wingman/templates/.env.example"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CONTRIBUTING.md", "LICENSE", "wingman.example.toml", ".env.example"]
